<title>To My Mind That Forbids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
  /* One visual world, deliberately: the film is the cosmos, so the page stays dark in both themes. */
  :root {
    color-scheme: dark;
    --ground: #07070F;
    --ink: #E8DDC2;
    --muted: #8C8474;
    --rule: #2A2733;
    --soul: #F3A53A;
    --screen: min(100%, calc(100dvh - 150px), 920px);
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  .film {
    box-sizing: border-box;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-inline: 16px;
    padding-block: 18px;
  }
  .screen {
    width: var(--screen);
    max-width: 100%;
    aspect-ratio: 1;
  }
  #film {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--ground);
    box-shadow: 0 0 0 1px var(--rule), 0 40px 90px -40px rgba(0, 0, 0, 0.9);
    cursor: pointer;
  }
  .deck {
    width: var(--screen);
    max-width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 14px;
  }
  .deck button {
    appearance: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .deck button:hover { border-color: var(--muted); }
  .deck button[aria-pressed="true"] { border-color: var(--soul); color: var(--soul); }
  .deck svg { width: 16px; height: 16px; fill: currentColor; }
  .deck svg [hidden] { display: none; }
  :focus-visible { outline: 2px solid var(--soul); outline-offset: 3px; }
  .track { position: relative; height: 32px; cursor: pointer; touch-action: none; }
  .track .rail, .track .done { position: absolute; top: 50%; height: 1px; left: 0; }
  .track .rail { right: 0; background: var(--rule); }
  .track .done { background: var(--ink); opacity: 0.7; }
  .track .tick { position: absolute; top: calc(50% - 5px); width: 1px; height: 10px; background: var(--muted); opacity: 0.8; }
  .track .head {
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: var(--soul);
    box-shadow: 0 0 12px var(--soul);
  }
  .clock {
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .colophon {
    margin: 0;
    font-family: "IM Fell English SC", "IM Fell English", Georgia, serif;
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-align: center;
    text-wrap: balance;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @media (max-width: 480px) {
    .deck { gap: 10px; }
    .clock { font-size: 11px; }
  }
</style>

<main class="film">
  <div class="screen">
    <canvas id="film" role="img" aria-label="An animated, hand-drawn film of the poem To my mind that forbids, told from the cosmos."></canvas>
  </div>
  <div class="deck">
    <button id="play" type="button" aria-label="Pause">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-pause" d="M4 2h3v12H4zM9 2h3v12H9z"/><path class="i-play" d="M4 2l10 6-10 6z" hidden/></svg>
    </button>
    <div id="track" class="track" role="slider" tabindex="0" aria-label="Position in the film" aria-valuemin="0" aria-valuemax="90" aria-valuenow="0">
      <div class="rail"></div>
      <div class="done"></div>
      <div class="head"></div>
    </div>
    <span id="clock" class="clock">0:00 / 1:30</span>
    <button id="sound" type="button" aria-label="Sound" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="i-wave" d="M11 5.2c1 .8 1.5 1.7 1.5 2.8s-.5 2-1.5 2.8l-.8-.9c.7-.5 1-1.2 1-1.9s-.3-1.4-1-1.9z" hidden/><path class="i-mute" d="M10.6 5.4l.9-.9 1.6 1.6 1.6-1.6.9.9L14 7l1.6 1.6-.9.9L13.1 7.9l-1.6 1.6-.9-.9L12.2 7z"/></svg>
    </button>
  </div>
  <p class="colophon">To my mind that forbids · a poem by Sahaib</p>
  <p id="now-line" class="sr-only" aria-live="polite"></p>
</main>
<script>
'use strict';
/* Ink & paper kit shared by every scene.
   Everything draws in a 1000×1000 logical space; the engine scales it to the device.
   Randomness is seeded: K.seed(n) gives the same strokes for the whole of one "boil"
   frame (12 per second), so lines shimmer like hand-drawn animation instead of flickering. */
(function () {
  const FILM = (window.FILM = window.FILM || { scenes: {} });
  const K = (FILM.K = {});
  const W = (K.W = 1000), H = (K.H = 1000), TAU = (K.TAU = Math.PI * 2);

  K.C = {
    void: '#07070F',      // the cosmos
    voidInk: '#E8DDC2',   // pale ink used on the void
    paper: '#EDE0C4',     // aged plate paper
    ink: '#2B1A10',       // iron-gall ink
    sepia: '#6B4A2E',
    mind: '#86B3E3',      // cold construction blue
    mindDeep: '#16284A',
    cyan: '#A9DDEA',
    soul: '#F3A53A',      // warm amber
    soulHot: '#FFE6A8',
    ember: '#B8412C',
    ash: '#6E6862',
    gold: '#C99A3E',
    goldLight: '#EACB7A',
    blueprint: '#13274B',
    storm: '#2B2440',
    stormLight: '#8E86AA',
  };

  // ---------------------------------------------------------------- numbers
  K.clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.range = (t, a, b) => K.clamp((t - a) / (b - a));
  K.smooth = (t) => { t = K.clamp(t); return t * t * (3 - 2 * t); };
  K.sr = (t, a, b) => K.smooth(K.range(t, a, b));
  K.easeOut = (t) => 1 - Math.pow(1 - K.clamp(t), 3);
  K.easeIn = (t) => Math.pow(K.clamp(t), 3);
  K.easeInOut = (t) => { t = K.clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  K.bump = (t, a, b) => Math.sin(Math.PI * K.range(t, a, b)); // 0 → 1 → 0 across [a, b]
  K.frac = (x) => x - Math.floor(x);

  // ---------------------------------------------------------------- randomness
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  K.mulberry = mulberry32;
  K.hash = (n) => {
    n = n | 0;
    n = Math.imul(n ^ (n >>> 16), 0x7feb352d);
    n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
    n ^= n >>> 16;
    return (n >>> 0) / 4294967296;
  };
  let R = mulberry32(1);
  K.boil = 0; // set by the engine each frame: floor(T * 12)
  /** Reseed the stroke generator for one drawn element; changes with every boil frame. */
  K.seed = (k) => { R = mulberry32((Math.imul((k | 0) + 1, 2654435761) ^ Math.imul(K.boil + 7, 40503)) >>> 0); };
  /** Reseed without the boil: identical strokes on every frame (for things that must hold still). */
  K.still = (k) => { R = mulberry32(Math.imul((k | 0) + 1, 2654435761) >>> 0); };
  K.r = () => R();
  K.rr = (a, b) => a + (b - a) * R();
  K.rs = (a) => (R() * 2 - 1) * a;
  /** Independent generator for layouts (star fields, crowds). Never affected by the boil. */
  K.stable = (seed) => mulberry32(Math.imul((seed | 0) + 1, 2654435761) >>> 0);

  // smooth value noise, range −1..1
  K.n1 = (x) => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    const a = K.hash(i * 1013 + 7), b = K.hash((i + 1) * 1013 + 7);
    return (a + (b - a) * u) * 2 - 1;
  };
  const h2 = (x, y) => K.hash(Math.imul(x, 73856093) ^ Math.imul(y, 19349663));
  K.n2 = (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1);
    return (a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy) * 2 - 1;
  };
  K.fbm = (x, y, oct = 4) => {
    let s = 0, a = 0.5, f = 1;
    for (let i = 0; i < oct; i++) { s += a * K.n2(x * f, y * f); f *= 2.03; a *= 0.5; }
    return s;
  };

  // ---------------------------------------------------------------- colour
  const rgbCache = new Map();
  K.rgb = (c) => {
    if (Array.isArray(c)) return c;
    let v = rgbCache.get(c);
    if (v) return v;
    const h = c.replace('#', '');
    v = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    rgbCache.set(c, v);
    return v;
  };
  K.rgba = (c, a) => { const [r, g, b] = K.rgb(c); return `rgba(${r},${g},${b},${a})`; };
  K.mix = (c1, c2, t) => {
    const a = K.rgb(c1), b = K.rgb(c2); t = K.clamp(t);
    let s = '#';
    for (let i = 0; i < 3; i++) s += Math.round(a[i] + (b[i] - a[i]) * t).toString(16).padStart(2, '0');
    return s;
  };

  // ---------------------------------------------------------------- geometry (point arrays)
  K.seg = (x1, y1, x2, y2, step = 12) => {
    const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.ceil(L / step)), pts = [];
    for (let i = 0; i <= n; i++) pts.push([x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]);
    return pts;
  };
  /** Ellipse arc; rot tilts the ellipse. step = approx spacing along the curve. */
  K.arc = (cx, cy, rx, ry, a0 = 0, a1 = TAU, rot = 0, step = 9) => {
    const span = a1 - a0, L = Math.abs(span) * Math.max(rx, ry), n = Math.max(3, Math.ceil(L / step));
    const c = Math.cos(rot), s = Math.sin(rot), pts = [];
    for (let i = 0; i <= n; i++) {
      const a = a0 + (span * i) / n, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      pts.push([cx + x * c - y * s, cy + x * s + y * c]);
    }
    return pts;
  };
  K.bez = (p0, p1, p2, p3, n = 24) => {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      pts.push([
        u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
        u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
      ]);
    }
    return pts;
  };
  /** Catmull-Rom curve through control points. */
  K.spline = (ctrl, closed = false, per = 8) => {
    const pts = [], n = ctrl.length, cnt = closed ? n : n - 1;
    for (let i = 0; i < cnt; i++) {
      const p0 = ctrl[closed ? (i - 1 + n) % n : Math.max(i - 1, 0)], p1 = ctrl[i];
      const p2 = ctrl[(i + 1) % n], p3 = ctrl[closed ? (i + 2) % n : Math.min(i + 2, n - 1)];
      for (let j = 0; j < per; j++) {
        const t = j / per, t2 = t * t, t3 = t2 * t;
        pts.push([
          0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
        ]);
      }
    }
    if (!closed) pts.push(ctrl[n - 1]);
    return pts;
  };
  /** Translate / scale / rotate a point array. */
  K.xf = (pts, dx = 0, dy = 0, s = 1, rot = 0) => {
    const c = Math.cos(rot) * s, n = Math.sin(rot) * s;
    return pts.map(([x, y]) => [dx + x * c - y * n, dy + x * n + y * c]);
  };
  K.bbox = (pts) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
    return { x0, y0, x1, y1 };
  };
  /** Keep the first `p` (0..1) of a polyline — for lines that draw themselves on. */
  K.part = (pts, p) => {
    if (p >= 1) return pts;
    const n = Math.max(2, Math.round(pts.length * K.clamp(p)));
    return pts.slice(0, n);
  };

  // ---------------------------------------------------------------- paths & ink
  /** Clean path (for fills and clips). */
  K.path = (ctx, pts, closed = true) => {
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (closed) ctx.closePath();
  };
  /** Hand-inked path: the line wanders a little off its true course, smoothly. */
  K.trace = (ctx, pts, amp = 1, closed = false) => {
    const n = pts.length;
    if (n < 2) return;
    const off = R() * 1000, freq = 0.03 + R() * 0.025;
    let s = 0;
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[Math.min(i + 1, n - 1)], o = pts[Math.max(i - 1, 0)];
      let tx = q[0] - o[0], ty = q[1] - o[1];
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      if (i) s += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
      const w = amp * (K.n1(off + s * freq) + 0.3 * K.n1(off * 1.7 + s * freq * 4.1));
      const x = p[0] - ty * w, y = p[1] + tx * w;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    if (closed) ctx.closePath();
  };
  /** Global opacity multiplier every primitive honours — set it to fade a whole element. */
  K.A = 1;
  /** Draw fn() with everything in it faded by a (nests). */
  K.fade = (a, fn) => { const prev = K.A; K.A = prev * K.clamp(a); if (K.A > 0.004) fn(); K.A = prev; };
  K.stroke = (ctx, color, width = 1.6, alpha = 1) => {
    ctx.globalAlpha = alpha * K.A;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.globalAlpha = 1;
  };
  /** One inked line along pts. */
  K.ink = (ctx, pts, color, width = 1.6, amp = 1, closed = false, alpha = 1) => {
    ctx.beginPath();
    K.trace(ctx, pts, amp, closed);
    K.stroke(ctx, color, width, alpha);
  };
  K.line = (ctx, x1, y1, x2, y2, color, width = 1.4, amp = 1, alpha = 1) =>
    K.ink(ctx, K.seg(x1, y1, x2, y2), color, width, amp, false, alpha);

  const regionPath = (ctx, region) => { if (typeof region === 'function') region(ctx); else K.path(ctx, region, true); };
  K.clipTo = (ctx, region) => { ctx.beginPath(); regionPath(ctx, region); ctx.clip(); };
  /** Flat colour fill, nudged off-register like a hand-pulled print. */
  K.fill = (ctx, region, color, alpha = 1, mis = 1.4) => {
    ctx.save();
    ctx.translate(K.rs(mis), K.rs(mis));
    ctx.beginPath();
    regionPath(ctx, region);
    ctx.globalAlpha = alpha * K.A;
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  };

  /** Tonal hatching inside a region.
      density(x, y) → 0..1 ink coverage. Each line gets its own tone threshold, so lines run
      unbroken through dark passages and stop where the tone lightens — engraving, not noise.
      o: { angle, gap, step, amp, color, width, alpha, density, bbox } */
  K.hatch = (ctx, region, o = {}) => {
    const angle = o.angle ?? 0.9, gap = o.gap ?? 6, step = o.step ?? 12, amp = o.amp ?? 0.7;
    const dens = o.density || null;
    const bb = o.bbox || (region && typeof region !== 'function' ? K.bbox(region) : { x0: 0, y0: 0, x1: W, y1: H });
    ctx.save();
    if (region) K.clipTo(ctx, region);
    const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
    const rad = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + 2;
    const ca = Math.cos(angle), sa = Math.sin(angle);
    ctx.beginPath();
    for (let d = -rad; d <= rad; d += gap) {
      const tau = dens ? R() * 0.94 + 0.03 : 0;
      const dd = d + K.rs(gap * 0.18), wob = R() * 100;
      let pen = false;
      for (let s = -rad; s <= rad + step; s += step) {
        const w = amp * K.n1(wob + s * 0.05);
        const x = cx + ca * s - sa * (dd + w), y = cy + sa * s + ca * (dd + w);
        if (!dens || dens(x, y) > tau) { pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; }
        else pen = false;
      }
    }
    K.stroke(ctx, o.color || K.C.ink, o.width ?? 1, o.alpha ?? 1);
    ctx.restore();
  };
  /** Two crossing hatch passes; the second only in the darker half of the tone. */
  K.crosshatch = (ctx, region, o = {}) => {
    const d = o.density || (() => 1);
    K.hatch(ctx, region, o);
    K.hatch(ctx, region, { ...o, angle: (o.angle ?? 0.9) + 1.25, gap: (o.gap ?? 6) * 1.2, density: (x, y) => (d(x, y) - 0.45) / 0.55 });
  };
  /** Dots scattered through a region, thinned by density. o: { count, r0, r1, color, alpha, density, bbox } */
  K.stipple = (ctx, region, o = {}) => {
    const n = o.count ?? 400, dens = o.density, r0 = o.r0 ?? 0.7, r1 = o.r1 ?? 1.6;
    const bb = o.bbox || (region && typeof region !== 'function' ? K.bbox(region) : { x0: 0, y0: 0, x1: W, y1: H });
    ctx.save();
    if (region) K.clipTo(ctx, region);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = K.rr(bb.x0, bb.x1), y = K.rr(bb.y0, bb.y1), r = K.rr(r0, r1), q = R();
      if (dens && dens(x, y) < q) continue;
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, TAU);
    }
    ctx.globalAlpha = (o.alpha ?? 1) * K.A;
    ctx.fillStyle = o.color || K.C.ink;
    ctx.fill();
    ctx.restore();
  };
  /** Lambert tone of a sphere lit from screen direction (lx, ly): density function for K.hatch. */
  K.sphereTone = (cx, cy, r, lx, ly, amb = 0.08) => {
    const lz = 0.6, ll = Math.hypot(lx, ly, lz);
    return (x, y) => {
      const nx = (x - cx) / r, ny = (y - cy) / r, q = 1 - nx * nx - ny * ny;
      if (q <= 0) return 1;
      const d = (nx * lx + ny * ly + Math.sqrt(q) * lz) / ll;
      return K.clamp(1 - Math.max(0, d) - amb);
    };
  };
  /** Soft light. mode 'lighter' glows on dark grounds; use 'screen' or 'source-over' on paper. */
  K.glow = (ctx, x, y, r, color, a = 1, mode = 'lighter') => {
    a *= K.A;
    if (a <= 0.003 || r <= 0) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, K.rgba(color, K.clamp(a)));
    g.addColorStop(0.35, K.rgba(color, K.clamp(a) * 0.45));
    g.addColorStop(1, K.rgba(color, 0));
    ctx.save();
    ctx.globalCompositeOperation = mode;
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
    ctx.restore();
  };

  // ---------------------------------------------------------------- stars & nebulae
  K.makeStars = (seed, n, x0 = -250, y0 = -250, x1 = W + 250, y1 = H + 250) => {
    const r = K.stable(seed), out = [];
    for (let i = 0; i < n; i++) out.push({ x: x0 + r() * (x1 - x0), y: y0 + r() * (y1 - y0), m: Math.pow(r(), 3.2), ph: r() * TAU, hue: r() });
    return out;
  };
  K.drawStars = (ctx, stars, t, o = {}) => {
    const a = (o.alpha ?? 1) * K.A, col = o.color || K.C.voidInk;
    if (a <= 0) return;
    ctx.save();
    ctx.fillStyle = col;
    const big = [];
    for (const s of stars) {
      const tw = 0.62 + 0.38 * Math.sin(t * (1.1 + s.hue * 1.4) + s.ph);
      const al = a * (0.22 + 0.78 * s.m) * tw;
      if (al < 0.02) continue;
      const sz = 0.8 + s.m * 2.3;
      ctx.globalAlpha = al;
      ctx.fillRect(s.x - sz / 2, s.y - sz / 2, sz, sz);
      if (s.m > 0.5) big.push([s, al]);
    }
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = col;
    for (const [s, al] of big) {
      const L = 4 + s.m * 12;
      ctx.globalAlpha = al * 0.85;
      ctx.beginPath();
      ctx.moveTo(s.x - L, s.y); ctx.lineTo(s.x + L, s.y);
      ctx.moveTo(s.x, s.y - L); ctx.lineTo(s.x, s.y + L);
      ctx.stroke();
      K.glow(ctx, s.x, s.y, L * 1.5, s.hue > 0.6 ? K.C.cyan : K.C.soulHot, (al / K.A) * 0.22);
    }
    ctx.restore();
  };
  /** Pre-rendered nebula (soft, so it lives at low resolution). Returns a canvas of size×size logical units. */
  K.nebula = (seed, size = 1400, colors = ['#4B2E7A', '#1F5E78', '#7A2F55', '#2B3F8C']) => {
    const [c, x] = K.makeCanvas(size, size, 0.5);
    const r = K.stable(seed);
    x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 170; i++) {
      const u = r();
      const bx = size * 0.08 + u * size * 0.84;
      const by = size / 2 + Math.sin(u * 5.3 + seed) * size * 0.17 + (r() - 0.5) * size * 0.26;
      const br = 40 + r() * 230, col = colors[(r() * colors.length) | 0];
      const g = x.createRadialGradient(bx, by, 0, bx, by, br);
      g.addColorStop(0, K.rgba(col, 0.09 + r() * 0.1));
      g.addColorStop(1, K.rgba(col, 0));
      x.fillStyle = g;
      x.fillRect(bx - br, by - br, 2 * br, 2 * br);
    }
    x.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 46; i++) {
      const bx = r() * size, by = size / 2 + (r() - 0.5) * size * 0.4, br = 30 + r() * 120;
      const g = x.createRadialGradient(bx, by, 0, bx, by, br);
      g.addColorStop(0, 'rgba(0,0,0,0.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g;
      x.fillRect(bx - br, by - br, 2 * br, 2 * br);
    }
    x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 2600; i++) {
      const u = r(), bx = u * size, by = size / 2 + Math.sin(u * 5.3 + seed) * size * 0.17 + (r() - 0.5) * size * 0.3 * r();
      x.fillStyle = K.rgba(r() > 0.7 ? '#FFE6A8' : '#CFE4F2', 0.12 + r() * 0.3);
      x.fillRect(bx, by, 1.4, 1.4);
    }
    return c;
  };

  // ---------------------------------------------------------------- recurring motifs
  /** The soul: a warm star. i = intensity (1 full light … 0 ash). */
  K.soulStar = (ctx, x, y, r, i, t, o = {}) => {
    i = K.clamp(i);
    const warm = K.mix(K.C.ash, K.C.soul, i), hot = K.mix('#A39C92', K.C.soulHot, i), rim = K.mix('#3F3A35', K.C.ember, i);
    K.glow(ctx, x, y, r * (2.4 + 6.5 * i), K.C.soul, 0.05 + 0.3 * i);
    K.glow(ctx, x, y, r * (1.3 + 1.5 * i), K.C.soulHot, 0.1 + 0.45 * i);
    K.seed(o.seed ?? 11);
    ctx.beginPath();
    const n = 26;
    for (let k = 0; k < n; k++) {
      const a = (k / n) * TAU + t * 0.05 + K.rs(0.05);
      const f = 0.5 + 0.5 * K.n1(t * 2.4 + k * 3.7);
      const len = r * (1.3 + (k % 2 ? 0.6 : 1.5) * f * (0.3 + 0.7 * i) * (o.rays ?? 1));
      const ca = Math.cos(a), sa = Math.sin(a);
      K.trace(ctx, K.seg(x + ca * r * 1.14, y + sa * r * 1.14, x + ca * len, y + sa * len, 5), 0.5);
    }
    K.stroke(ctx, warm, 1.2, 0.45 + 0.5 * i);
    const g = ctx.createRadialGradient(x - r * 0.32, y - r * 0.32, r * 0.08, x, y, r);
    g.addColorStop(0, hot);
    g.addColorStop(1, warm);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();
    if (r > 9) K.hatch(ctx, K.arc(x, y, r, r), { angle: -0.75, gap: Math.max(2.4, r / 7), step: 5, amp: 0.4, color: rim, width: 0.8, alpha: 0.55, density: (px, py) => K.clamp((px - x + (py - y)) / (r * 1.5) + 0.05) });
    K.ink(ctx, K.arc(x, y, r, r, 0, TAU * 1.04), rim, Math.max(0.8, r / 14), 0.5);
    if (r > 7) K.ink(ctx, K.arc(x, y, r * 0.7, r * 0.7, 3.55, 4.7), '#FFF8E6', 1.4, 0.3, false, 0.15 + 0.75 * i);
  };
  /** A hand-drawn flame standing on (x, y). h = height, i = intensity, beat adds a heartbeat lift. */
  K.flame = (ctx, x, y, h, t, i = 1, o = {}) => {
    i = K.clamp(i);
    if (i <= 0.01) return;
    const seed = o.seed ?? 21;
    const sway = K.n1(t * 1.9 + seed) * h * 0.14;
    const lick = 1 + 0.12 * K.n1(t * 7.3 + seed) + (o.beat ?? 0) * 0.18;
    const Hh = h * lick * (0.3 + 0.7 * i), wd = h * 0.25 * (0.55 + 0.45 * i);
    const tip = [x + sway, y - Hh];
    const outer = K.spline([[x, y + wd * 0.3], [x - wd, y - Hh * 0.16], [x - wd * 0.55, y - Hh * 0.55], tip, [x + wd * 0.6, y - Hh * 0.5], [x + wd, y - Hh * 0.14]], true, 10);
    K.glow(ctx, x, y - Hh * 0.4, h * (1.3 + 2 * i), K.C.soul, 0.32 * i, o.mode || 'lighter');
    K.seed(seed);
    K.fill(ctx, outer, K.mix(K.C.ash, K.C.soul, i), 0.95, 0.7);
    const inner = K.spline([[x, y + wd * 0.18], [x - wd * 0.45, y - Hh * 0.2], [x + sway * 0.6, y - Hh * 0.62], [x + wd * 0.45, y - Hh * 0.2]], true, 8);
    K.fill(ctx, inner, K.mix('#BDB5A8', K.C.soulHot, i), 1, 0.4);
    K.ink(ctx, outer, K.mix('#3A342F', K.C.ember, i), Math.max(0.9, h / 40), 0.4, true);
    ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const bx = x + (k - 1) * wd * 0.35;
      K.trace(ctx, K.seg(bx, y - Hh * 0.12, bx + sway * 0.5, y - Hh * (0.42 + 0.1 * k), 4), 0.6);
    }
    K.stroke(ctx, K.C.ember, Math.max(0.6, h / 70), 0.5 * i);
  };
  /** A thread of light along pts: glow, a fine inked core and sparks travelling outward.
      i = intensity, reveal = how much of the thread exists (0..1, from pts[0]). */
  K.thread = (ctx, pts, t, i = 1, reveal = 1, o = {}) => {
    if (i <= 0.01 || reveal <= 0) return;
    const sub = K.part(pts, reveal);
    ctx.save();
    ctx.globalCompositeOperation = o.mode || 'lighter';
    ctx.beginPath(); K.path(ctx, sub, false); K.stroke(ctx, K.C.soul, 9, 0.07 * i);
    ctx.beginPath(); K.path(ctx, sub, false); K.stroke(ctx, K.C.soul, 3.5, 0.2 * i);
    ctx.restore();
    K.seed(o.seed ?? 31);
    K.ink(ctx, sub, K.C.soulHot, o.width ?? 1.4, 0.5, false, 0.95 * i);
    const n = sub.length;
    for (let k = 0; k < 4; k++) {
      const s = K.frac(t * (o.speed ?? 0.3) + k / 4);
      const idx = Math.min(n - 1, Math.floor(s * (pts.length - 1)));
      if (idx >= n) continue;
      const [px, py] = sub[idx];
      K.glow(ctx, px, py, 14, K.C.soulHot, 0.55 * i * Math.sin(Math.PI * s), o.mode || 'lighter');
    }
  };

  /** Ruled lines across a sky, the way engravers laid in the heavens. density(y) → 0..1. */
  K.ruledSky = (ctx, o = {}) => {
    const gap = o.gap ?? 5, y0 = o.y0 ?? 0, y1 = o.y1 ?? H, x0 = o.x0 ?? -20, x1 = o.x1 ?? W + 20;
    const dens = o.density || (() => 1);
    K.seed(o.seed ?? 61);
    ctx.beginPath();
    for (let y = y0; y <= y1; y += gap) {
      const tau = R();
      let pen = false;
      const wob = R() * 50;
      for (let x = x0; x <= x1; x += 18) {
        const yy = y + 0.9 * K.n1(wob + x * 0.02);
        if (dens(x, yy) > tau) { pen ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); pen = true; } else pen = false;
      }
    }
    K.stroke(ctx, o.color || K.C.voidInk, o.width ?? 0.7, o.alpha ?? 0.07);
  };

  // ---------------------------------------------------------------- textures (built by the engine)
  K.tex = {};
  K.PX = 1;
  K.makeCanvas = (w, h, px = K.PX) => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w * px));
    c.height = Math.max(1, Math.ceil(h * px));
    const x = c.getContext('2d');
    x.setTransform(px, 0, 0, px, 0, 0);
    return [c, x];
  };
  function pixelNoise(c, amt, seed) {
    const x = c.getContext('2d'), id = x.getImageData(0, 0, c.width, c.height), d = id.data, r = K.stable(seed);

  }
  K.buildTextures = (px) => {
    K.PX = px;
    // plate paper
    {
      const [c, x] = K.makeCanvas(W, H, px), r = K.stable(77);
      x.fillStyle = K.C.paper; x.fillRect(0, 0, W, H);
      for (let i = 0; i < 90; i++) {
        const bx = r() * W, by = r() * H, br = 60 + r() * 240, dark = r() > 0.35;
        const g = x.createRadialGradient(bx, by, 0, bx, by, br);
        g.addColorStop(0, dark ? `rgba(160,128,84,${0.05 + r() * 0.07})` : `rgba(255,248,228,${0.06 + r() * 0.08})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = g; x.fillRect(bx - br, by - br, 2 * br, 2 * br);
      }
      x.lineWidth = 0.6;
      for (let i = 0; i < 1500; i++) {
        const fx = r() * W, fy = r() * H, a = r() * TAU, L = 4 + r() * 16;
        x.strokeStyle = `rgba(110,82,50,${0.05 + r() * 0.07})`;
        x.beginPath(); x.moveTo(fx, fy); x.quadraticCurveTo(fx + Math.cos(a) * L * 0.5 + (r() - 0.5) * 4, fy + Math.sin(a) * L * 0.5 + (r() - 0.5) * 4, fx + Math.cos(a) * L, fy + Math.sin(a) * L); x.stroke();
      }
      for (let i = 0; i < 2600; i++) { x.fillStyle = `rgba(90,62,36,${0.05 + r() * 0.12})`; const s = 0.5 + r() * 1.3; x.fillRect(r() * W, r() * H, s, s); }
      const e = x.createRadialGradient(500, 470, 380, 500, 500, 760);
      e.addColorStop(0, 'rgba(120,86,48,0)'); e.addColorStop(1, 'rgba(120,86,48,0.22)');
      x.fillStyle = e; x.fillRect(0, 0, W, H);
      pixelNoise(c, 16, 5);
      K.tex.paper = c;
    }
    // the void: near-black with faint cloud and grit
    {
      const [c, x] = K.makeCanvas(W, H, px), r = K.stable(91);
      x.fillStyle = K.C.void; x.fillRect(0, 0, W, H);
      for (let i = 0; i < 50; i++) {
        const bx = r() * W, by = r() * H, br = 100 + r() * 300;
        const g = x.createRadialGradient(bx, by, 0, bx, by, br);
        g.addColorStop(0, r() > 0.5 ? `rgba(22,30,70,${0.12 + r() * 0.12})` : `rgba(40,20,52,${0.1 + r() * 0.12})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = g; x.fillRect(bx - br, by - br, 2 * br, 2 * br);
      }
      pixelNoise(c, 9, 6);
      K.tex.void = c;
    }
    // film grain tile, device pixels
    {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const x = c.getContext('2d'), id = x.createImageData(256, 256), d = id.data, r = K.stable(3);
      for (let i = 0; i < d.length; i += 4) {
        const v = r(), on = v > 0.5 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = on;
        d[i + 3] = Math.abs(v - 0.5) * 34;
      }
      x.putImageData(id, 0, 0);
      K.tex.grain = c;
    }
    // vignette
    {
      const [c, x] = K.makeCanvas(W, H, Math.min(px, 1));
      const g = x.createRadialGradient(500, 480, 330, 500, 500, 780);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)');
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      K.tex.vignette = c;
    }
  };
  /** Paper ground, optionally stained with a tint (multiply keeps the grain). */
  K.paper = (ctx, tint = null, a = 0.5, mode = 'multiply') => {
    ctx.drawImage(K.tex.paper, 0, 0, W, H);
    if (tint && a > 0) {
      ctx.save();
      ctx.globalCompositeOperation = mode;
      ctx.globalAlpha = a;
      ctx.fillStyle = tint;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();

  };

  // ---------------------------------------------------------------- lettering
  K.FONT = '"IM Fell English", "Iowan Old Style", "Palatino Linotype", Georgia, serif';
  const pwCache = new Map();
  function prefixWidths(ctx, text) {
    const key = ctx.font + '|' + text;
    let v = pwCache.get(key);
    if (v) return v;
    v = [];
    for (let i = 0; i <= text.length; i++) v.push(ctx.measureText(text.slice(0, i)).width);
    pwCache.set(key, v);
    return v;
  }
  K.clearTextCache = () => pwCache.clear();
  /** Hand-lettered text that writes itself on, letter by letter. progress 0..1. */
  K.write = (ctx, text, x, y, o = {}) => {
    const size = o.size ?? 40, p = o.progress ?? 1, alpha = (o.alpha ?? 1) * K.A;
    if (p <= 0 || alpha <= 0) return;
    ctx.save();
    ctx.font = `${o.italic === false ? '' : 'italic '}${size}px ${K.FONT}`;
    ctx.textBaseline = 'alphabetic';
    const pw = prefixWidths(ctx, text), total = pw[text.length];
    const x0 = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
    const n = text.length, soft = 5, head = p * (n + soft);
    const rng = mulberry32((K.boil * 131 + n * 7 + Math.round(y) * 3) >>> 0);
    const jit = o.jitter ?? 0.8;
    ctx.fillStyle = o.color || K.C.ink;
    for (let i = 0; i < n; i++) {
      const jx = (rng() - 0.5) * jit, jy = (rng() - 0.5) * jit, rot = (rng() - 0.5) * 0.028;
      const a = K.clamp((head - i) / soft);
      if (a <= 0) break;
      const ch = text[i];
      if (ch === ' ') continue;
      ctx.save();
      ctx.translate(x0 + pw[i] + jx, y + jy + (1 - a) * 3);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha * a;
      ctx.fillText(ch, 0, 0);
      ctx.globalAlpha = alpha * a * 0.28;
      ctx.fillText(ch, 0.7, 0.35);
      ctx.restore();
    }
    ctx.restore();
  };
  /** The poem lines of a scene, written into the lower margin. Called by the engine. */
  K.caption = (ctx, lines, t, dur, tone, strength = 1) => {
    if (!lines || !lines.length) return;
    const ink = tone === 'paper' ? K.C.ink : K.C.voidInk;
    const ground = tone === 'paper' ? K.C.paper : K.C.void;
    const base = lines.length === 1 ? 926 : 872, lead = 54;
    let vis = 0;
    const st = lines.map((ln) => {
      const wd = ln.wd ?? Math.max(1.3, ln.text.length * 0.06);
      const p = K.range(t, ln.at, ln.at + wd);
      const out = ln.out ?? dur - 0.8;
      const a = 1 - K.range(t, out, out + 0.7);
      vis = Math.max(vis, Math.min(1, p * 3) * a);
      return { p, a };
    });
    if (vis <= 0) return;
    const g = ctx.createLinearGradient(0, 690, 0, H);
    g.addColorStop(0, K.rgba(ground, 0));
    g.addColorStop(0.5, K.rgba(ground, 0.5 * vis * strength));
    g.addColorStop(1, K.rgba(ground, 0.86 * vis * strength));
    ctx.fillStyle = g;
    ctx.fillRect(0, 690, W, H - 690);
    lines.forEach((ln, i) => K.write(ctx, ln.text, 72 + i * 36, base + i * lead, { size: 40, color: ink, progress: st[i].p, alpha: st[i].a }));
  };
})();

'use strict';
/* Plates I and IX — the orrery.
   Mind: a cold planet caged in armillary rings. Soul: a warm star. They orbit one another;
   the poem opens and closes on them, and the last frame is the first. */
(function () {
  const FILM = window.FILM, K = FILM.K, C = K.C, TAU = K.TAU;
  const CX = 500, CY = 430, TILT = -0.1, SPIN = 0.3;
  const SOUL = { rx: 300, ry: 112 }, MIND = { rx: 108, ry: 40 };
  const MIND_R = 78, SOUL_R = 30;
  let stars, far, nebula;

  function onEllipse(e, a) {
    const x = Math.cos(a) * e.rx, y = Math.sin(a) * e.ry, c = Math.cos(TILT), s = Math.sin(TILT);
    return [CX + x * c - y * s, CY + x * s + y * c, Math.sin(a)]; // third value: depth, +1 nearest
  }
  const soulAt = (th) => onEllipse(SOUL, th);
  const mindAt = (th) => onEllipse(MIND, th + Math.PI);
  const ellPt = (x, y, rx, ry, a, rot) => {
    const px = Math.cos(a) * rx, py = Math.sin(a) * ry, c = Math.cos(rot), s = Math.sin(rot);
    return [x + px * c - py * s, y + px * s + py * c];
  };
  // Where the loop joins: a single point of light.
  FILM.orrerySeam = soulAt(-Math.PI / 2);

  // ---------------------------------------------------------------- the nebula, engraved
  /** Stippled and ruled like an observatory drawing, not airbrushed. Rendered once. */
  function buildDust() {
    const S = 1400, px = Math.min(K.PX, 1.5);
    const [c, x] = K.makeCanvas(S, S, px);
    const band = (X, Y) => {
      const u = X / S, cy = S / 2 + Math.sin(u * 5.3 + 3) * S * 0.17;
      const w = S * (0.12 + 0.05 * K.n1(u * 6 + 2)), dy = (Y - cy) / w;
      let m = Math.exp(-dy * dy) * (0.55 + 0.6 * K.fbm(X * 0.004 + 3, Y * 0.004 + 9, 4));
      m *= 1 - K.clamp((K.fbm(X * 0.006 + 20, Y * 0.011 + 1, 3) - 0.08) * 3) * 0.85; // dark lanes
      return K.clamp(m);
    };
    // a breath of colour for depth, kept cold and low
    const g = K.stable(41);
    x.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 70; i++) {
      const u = g(), bx = u * S, by = S / 2 + Math.sin(u * 5.3 + 3) * S * 0.17 + (g() - 0.5) * S * 0.16, br = 80 + g() * 200;
      const gr = x.createRadialGradient(bx, by, 0, bx, by, br);
      gr.addColorStop(0, g() > 0.75 ? 'rgba(92,60,110,0.07)' : 'rgba(44,62,112,0.08)');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = gr;
      x.fillRect(bx - br, by - br, 2 * br, 2 * br);
    }
    x.globalCompositeOperation = 'source-over';
    // ruled streaks running with the band, broken by its density
    K.still(43);
    K.hatch(x, null, { angle: -0.28, gap: 2.8, step: 9, amp: 0.6, color: C.voidInk, width: 0.55, alpha: 0.13, density: (X, Y) => band(X, Y) * 1.05 - 0.08, bbox: { x0: 0, y0: 0, x1: S, y1: S } });
    K.hatch(x, null, { angle: 0.35, gap: 3.4, step: 9, amp: 0.6, color: C.cyan, width: 0.5, alpha: 0.08, density: (X, Y) => (band(X, Y) - 0.45) * 1.8, bbox: { x0: 0, y0: 0, x1: S, y1: S } });
    // stipple: the dust itself
    const r = K.stable(47);
    for (let i = 0; i < 90000; i++) {
      const X = r() * S, Y = S / 2 + (r() - 0.5) * S * 0.72, d = band(X, Y);
      if (Math.pow(d, 1.25) < r()) continue;
      const q = r(), z = 0.5 + r() * r() * 1.5;
      x.fillStyle = q > 0.93 ? K.rgba(C.soulHot, 0.35 + r() * 0.4) : q > 0.86 ? K.rgba(C.cyan, 0.3 + r() * 0.4) : K.rgba(C.voidInk, 0.18 + r() * 0.5 * d);
      x.fillRect(X, Y, z, z);
    }
    // knots where stars are being born
    for (let i = 0; i < 14; i++) {
      const u = r(), X = u * S, Y = S / 2 + Math.sin(u * 5.3 + 3) * S * 0.17 + (r() - 0.5) * S * 0.1;
      if (band(X, Y) < 0.35) continue;
      const gr = x.createRadialGradient(X, Y, 0, X, Y, 12);
      gr.addColorStop(0, 'rgba(255,230,168,0.16)');
      gr.addColorStop(1, 'rgba(255,230,168,0)');
      x.fillStyle = gr;
      x.fillRect(X - 12, Y - 12, 24, 24);
      for (let k = 0; k < 40; k++) { const a = r() * K.TAU, d = r() * r() * 22; x.fillStyle = K.rgba(C.soulHot, 0.5 * r()); x.fillRect(X + Math.cos(a) * d, Y + Math.sin(a) * d, 1.1, 1.1); }
    }
    return c;
  }

  // ---------------------------------------------------------------- construction drawing
  function construction(ctx, reveal, alpha) {
    if (alpha <= 0.01 || reveal <= 0) return;
    const a0 = -Math.PI / 2, a1 = a0 + TAU * reveal, RR = 372;
    K.seed(101);
    K.ink(ctx, K.arc(CX, CY, RR, RR, a0, a1), C.mind, 1, 0.8, false, 0.34 * alpha);
    K.ink(ctx, K.arc(CX, CY, RR + 12, RR + 12, a0, a1), C.mind, 0.7, 0.8, false, 0.2 * alpha);
    ctx.beginPath();
    for (let d = 0; d < 360; d += 5) {
      const a = a0 + (d / 360) * TAU;
      if (a > a1) break;
      const L = d % 30 === 0 ? 16 : d % 10 === 0 ? 9 : 5, c = Math.cos(a), s = Math.sin(a);
      ctx.moveTo(CX + c * RR, CY + s * RR);
      ctx.lineTo(CX + c * (RR - L), CY + s * (RR - L));
    }
    K.stroke(ctx, C.mind, 0.9, 0.34 * alpha);
    const lr = K.sr(reveal, 0.1, 0.8);
    ctx.save();
    ctx.setLineDash([3, 9]);
    ctx.beginPath();
    ctx.moveTo(CX - 430 * lr, CY); ctx.lineTo(CX + 430 * lr, CY);
    ctx.moveTo(CX, CY - 390 * lr); ctx.lineTo(CX, CY + 360 * lr);
    for (const a of [Math.PI / 6, -Math.PI / 6]) {
      ctx.moveTo(CX - Math.cos(a) * 350 * lr, CY - Math.sin(a) * 350 * lr);
      ctx.lineTo(CX + Math.cos(a) * 350 * lr, CY + Math.sin(a) * 350 * lr);
    }
    K.stroke(ctx, C.mind, 0.8, 0.15 * alpha);
    ctx.restore();
    // compass arcs pricked from the rim, a drafter's working marks
    K.seed(103);
    for (let k = 0; k < 4; k++) {
      const a = -Math.PI / 2 + (k * TAU) / 4 + 0.42, px = CX + Math.cos(a) * RR, py = CY + Math.sin(a) * RR;
      const vis = K.sr(reveal, 0.3 + k * 0.14, 0.62 + k * 0.1);
      if (vis > 0) K.ink(ctx, K.arc(px, py, 118, 118, a + Math.PI - 0.5, a + Math.PI - 0.5 + 1.0 * vis), C.mind, 0.8, 0.6, false, 0.2 * alpha);
      K.ink(ctx, K.arc(px, py, 3, 3), C.mind, 0.8, 0.2, false, 0.4 * alpha * vis);
    }
    K.ink(ctx, K.arc(CX, CY, 8, 8), C.mind, 0.9, 0.3, false, 0.5 * alpha);
    K.line(ctx, CX - 15, CY, CX + 15, CY, C.mind, 0.8, 0.2, 0.5 * alpha);
    K.line(ctx, CX, CY - 15, CX, CY + 15, C.mind, 0.8, 0.2, 0.5 * alpha);
  }

  function orbits(ctx, reveal, alpha) {
    if (alpha <= 0.01 || reveal <= 0) return;
    ctx.save();
    ctx.setLineDash([2, 7]);
    K.seed(111);
    K.ink(ctx, K.part(K.arc(CX, CY, SOUL.rx, SOUL.ry, -Math.PI / 2, TAU - Math.PI / 2, TILT), reveal), C.soul, 1.1, 0.6, false, 0.38 * alpha);
    K.ink(ctx, K.part(K.arc(CX, CY, MIND.rx, MIND.ry, Math.PI / 2, TAU + Math.PI / 2, TILT), reveal), C.mind, 1.1, 0.6, false, 0.45 * alpha);
    ctx.restore();
  }

  /** A dimension line held taut between the two bodies. */
  function tension(ctx, m, s, alpha, t) {
    if (alpha <= 0.01) return;
    const dx = s[0] - m[0], dy = s[1] - m[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    const a = [m[0] + ux * 110, m[1] + uy * 110], b = [s[0] - ux * 36, s[1] - uy * 36];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (len < 30) return;
    K.seed(301);
    K.ink(ctx, K.seg(a[0], a[1], b[0], b[1], 10), C.cyan, 0.8, 0.5, false, 0.32 * alpha);
    ctx.beginPath();
    const off = (t * 14) % 14;
    for (let d = off; d < len; d += 14) {
      const px = a[0] + ux * d, py = a[1] + uy * d;
      ctx.moveTo(px - uy * 3.5, py + ux * 3.5);
      ctx.lineTo(px + uy * 3.5, py - ux * 3.5);
    }
    K.stroke(ctx, C.cyan, 0.7, 0.28 * alpha);
    for (const [px, py, dir] of [[a[0], a[1], 1], [b[0], b[1], -1]]) {
      ctx.beginPath();
      ctx.moveTo(px + (ux * 9 - uy * 4) * dir, py + (uy * 9 + ux * 4) * dir);
      ctx.lineTo(px, py);
      ctx.lineTo(px + (ux * 9 + uy * 4) * dir, py + (uy * 9 - ux * 4) * dir);
      K.stroke(ctx, C.cyan, 0.8, 0.4 * alpha);
    }
  }

  // ---------------------------------------------------------------- the mechanism
  /** A toothed wheel, hand-inked. */
  function gear(ctx, x, y, r, teeth, rot, color, alpha, width = 1.2) {
    const pts = [];
    for (let k = 0; k < teeth; k++) {
      const a = rot + (k / teeth) * TAU, d = TAU / teeth;
      pts.push(ellPt(x, y, r, r, a, 0), ellPt(x, y, r * 1.14, r * 1.14, a + d * 0.12, 0), ellPt(x, y, r * 1.14, r * 1.14, a + d * 0.45, 0), ellPt(x, y, r, r, a + d * 0.57, 0));
    }
    K.ink(ctx, pts, color, width, 0.3, true, alpha);
    K.ink(ctx, K.arc(x, y, r * 0.42, r * 0.42), color, width * 0.8, 0.3, false, alpha);
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = rot + (k / 5) * TAU;
      K.trace(ctx, K.seg(x + Math.cos(a) * r * 0.42, y + Math.sin(a) * r * 0.42, x + Math.cos(a) * r * 0.95, y + Math.sin(a) * r * 0.95, 6), 0.3);
    }
    K.stroke(ctx, color, width * 0.8, alpha * 0.8);
  }
  FILM.gear = gear;
  /** The orrery's brass: arms from the centre post to each body, and the wheels that turn them. */
  function brass(ctx, t, m, s, alpha) {
    if (alpha <= 0.01) return;
    K.seed(501);
    for (const [p, w] of [[m, 2.6], [s, 2]]) {
      K.ink(ctx, K.seg(CX, CY, p[0], p[1], 12), C.gold, w, 0.5, false, 0.75 * alpha);
      K.ink(ctx, K.seg(CX, CY - 2, p[0], p[1] - 2, 12), C.goldLight, 0.7, 0.5, false, 0.5 * alpha);
    }
    gear(ctx, CX, CY, 30, 18, t * 0.3, C.gold, 0.8 * alpha, 1.3);
    gear(ctx, CX + 46, CY + 18, 15, 10, -t * 0.54 + 0.2, C.gold, 0.6 * alpha, 1);
    K.glow(ctx, CX, CY, 60, C.gold, 0.12 * alpha);
  }

  // ---------------------------------------------------------------- the mind
  const rings = (t, tighten) => [0, 1, 2].map((k) => ({
    k,
    R: MIND_R * (1.4 + 0.25 * k) * tighten,
    rot: -0.5 + k * 1.05 + t * 0.13 * (k % 2 ? 1 : -1),
    sq: 0.3 + 0.07 * k,
  }));
  const GAP = [0.35, 1.05]; // where the thunder broke ring 1 (ellipse parameter, radians)

  function ringHalf(ctx, x, y, ring, front, alpha, crack) {
    if (alpha <= 0.01) return;
    const a0 = front ? 0 : Math.PI, a1 = a0 + Math.PI;
    let spans = [[a0, a1]];
    if (crack > 0 && ring.k === 1) {
      spans = [];
      const g0 = GAP[0], g1 = GAP[0] + (GAP[1] - GAP[0]) * crack;
      if (front) { if (g0 > a0) spans.push([a0, g0]); if (g1 < a1) spans.push([g1, a1]); }
      else spans.push([a0, a1]);
    }
    K.seed(401 + ring.k * 3 + (front ? 1 : 0));
    for (const [s0, s1] of spans) {
      K.ink(ctx, K.arc(x, y, ring.R, ring.R * ring.sq, s0, s1, ring.rot), C.mind, 1.7, 0.6, false, alpha);
      K.ink(ctx, K.arc(x, y, ring.R * 1.06, ring.R * 1.06 * ring.sq, s0, s1, ring.rot), C.mind, 0.8, 0.6, false, alpha * 0.5);
    }
    // graduations between the two rules of each band
    ctx.beginPath();
    for (let k = 0; k <= 15; k++) {
      const a = a0 + (k * Math.PI) / 15;
      if (crack > 0 && ring.k === 1 && a > GAP[0] - 0.02 && a < GAP[0] + (GAP[1] - GAP[0]) * crack + 0.02) continue;
      const [ix, iy] = ellPt(x, y, ring.R, ring.R * ring.sq, a, ring.rot);
      const [ox, oy] = ellPt(x, y, ring.R * 1.06, ring.R * 1.06 * ring.sq, a, ring.rot);
      ctx.moveTo(ix, iy);
      ctx.lineTo(ox, oy);
    }
    K.stroke(ctx, C.mind, 0.7, alpha * 0.6);
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = a0 + ((k + 0.5) * Math.PI) / 6;
      if (crack > 0 && ring.k === 1 && a > GAP[0] - 0.05 && a < GAP[1] + 0.05) continue;
      const [px, py] = ellPt(x, y, ring.R * 1.03, ring.R * 1.03 * ring.sq, a, ring.rot);
      ctx.moveTo(px + 2.4, py);
      ctx.arc(px, py, 2.4, 0, TAU);
    }
    ctx.globalAlpha = alpha * K.A;
    ctx.fillStyle = C.cyan;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (front) {
      // cage bars from the ring down onto the planet
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = 0.35 + k * 0.8;
        if (crack > 0 && ring.k === 1 && a > GAP[0] - 0.1 && a < GAP[1] + 0.1) continue;
        const [px, py] = ellPt(x, y, ring.R, ring.R * ring.sq, a, ring.rot);
        const dx = px - x, dy = py - y, L = Math.hypot(dx, dy) || 1;
        K.trace(ctx, K.seg(px, py, x + (dx / L) * MIND_R * 0.96, y + (dy / L) * MIND_R * 0.96, 6), 0.4);
      }
      K.stroke(ctx, C.mind, 1, alpha * 0.55);
    }
  }

  function mindBody(ctx, x, y, r, t, lx, ly, soulI, crack) {
    const body = K.arc(x, y, r, r);
    K.seed(201);
    K.fill(ctx, body, C.mindDeep, 1, 1);
    const tone = K.sphereTone(x, y, r, lx, ly, 0.05);
    K.hatch(ctx, body, { angle: 0.6, gap: 2.6, step: 6, amp: 0.4, color: '#040A16', width: 1, density: tone });
    K.hatch(ctx, body, { angle: 1.95, gap: 3.2, step: 6, amp: 0.4, color: '#040A16', width: 0.9, density: (px, py) => (tone(px, py) - 0.42) / 0.58 });
    K.hatch(ctx, body, { angle: -0.45, gap: 3.6, step: 6, amp: 0.4, color: '#02060E', width: 0.9, density: (px, py) => (tone(px, py) - 0.7) / 0.3 });
    K.stipple(ctx, body, { count: 260, r0: 0.5, r1: 1.1, color: '#02060E', alpha: 0.8, density: (px, py) => (tone(px, py) - 0.3) * 1.4 });
    // curved form-lines along the latitudes, only through the half-tones
    {
      const ct0 = Math.cos(0.38), st0 = Math.sin(0.38);
      K.seed(207);
      ctx.beginPath();
      for (let k = 1; k < 26; k++) {
        const ph = -Math.PI / 2 + (k / 26) * Math.PI, yy = -r * Math.sin(ph), hw = r * Math.cos(ph), tau = 0.15 + K.r() * 0.2;
        let pen = false;
        for (let j = 0; j <= 20; j++) {
          const a = (j / 20) * Math.PI, px = hw * Math.cos(a), py = yy + hw * 0.16 * Math.sin(a);
          const X = x + px * ct0 - py * st0, Y = y + px * st0 + py * ct0, v = tone(X, Y);
          if (v > tau && v < 0.78) { pen ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); pen = true; } else pen = false;
        }
      }
      K.stroke(ctx, C.mind, 0.6, 0.35);
    }
    // a lattice of nuclei on the surface, turning with the planet
    {
      const N = 170, spin = t * 0.22, ct0 = Math.cos(0.38), st0 = Math.sin(0.38);
      ctx.fillStyle = C.cyan;
      for (let i = 0; i < N; i++) {
        const yv = 1 - (2 * (i + 0.5)) / N, rad = Math.sqrt(1 - yv * yv), th = i * 2.399963 + spin;
        const px = Math.cos(th) * rad, pz = Math.sin(th) * rad;
        if (pz < 0.05) continue;
        const X = x + (px * ct0 - -yv * st0) * r * 0.97, Y = y + (px * st0 + -yv * ct0) * r * 0.97, lit = 1 - tone(X, Y);
        const z = 0.8 + 1.6 * pz;
        ctx.globalAlpha = K.A * K.clamp(0.12 + 0.75 * lit) * pz;
        ctx.fillRect(X - z / 2, Y - z / 2, z, z);
      }
      ctx.globalAlpha = 1;
    }
    // latitude & longitude, tilted and slowly turning
    const tilt = 0.38, ct = Math.cos(tilt), st = Math.sin(tilt);
    const rp = (px, py) => [x + px * ct - py * st, y + px * st + py * ct];
    ctx.beginPath();
    for (let m = 0; m < 12; m++) {
      const lam = (m / 12) * TAU + t * 0.22;
      if (Math.cos(lam) <= 0.02) continue;
      const pts = [];
      for (let k = 0; k <= 16; k++) {
        const ph = -Math.PI / 2 + (k / 16) * Math.PI;
        pts.push(rp(r * Math.cos(ph) * Math.sin(lam), -r * Math.sin(ph)));
      }
      K.trace(ctx, pts, 0.35);
    }
    for (const ph of [-1.05, -0.52, 0, 0.52, 1.05]) {
      const yy = -r * Math.sin(ph), hw = r * Math.cos(ph), pts = [];
      for (let k = 0; k <= 14; k++) { const a = (k / 14) * Math.PI; pts.push(rp(hw * Math.cos(a), yy + hw * 0.16 * Math.sin(a))); }
      K.trace(ctx, pts, 0.35);
    }
    K.stroke(ctx, C.mind, 0.8, 0.5);
    // the soul lights the mind's near limb
    const la = Math.atan2(ly, lx);
    K.ink(ctx, K.arc(x, y, r - 1.8, r - 1.8, la - 1.0, la + 1.0), C.soulHot, 2.2, 0.4, false, 0.2 + 0.6 * soulI);
    K.ink(ctx, K.arc(x, y, r, r, 0, TAU * 1.03), C.mind, 1.8, 0.6);
    if (crack > 0) {
      const g = K.stable(5), pts = [];
      let px = x - r * 0.7, py = y - r * 0.28;
      for (let k = 0; k <= 10; k++) { pts.push([px, py]); px += r * 0.135; py += (g() - 0.42) * r * 0.22; }
      const vis = K.part(pts, crack);
      const mid = vis[Math.floor(vis.length / 2)];
      K.glow(ctx, mid[0], mid[1], r * 0.9, C.soul, 0.35 * crack);
      K.seed(211);
      K.ink(ctx, vis, C.soul, 4, 0.3, false, 0.3);
      K.ink(ctx, vis, C.soulHot, 1.5, 0.3);
    }
  }

  function brokenPiece(ctx, x, y, ring, t, crack) {
    if (crack <= 0) return;
    // the snapped length of ring 1 drifts loose, turning slowly
    const a = (GAP[0] + GAP[1]) / 2, [px, py] = ellPt(x, y, ring.R, ring.R * ring.sq, a, ring.rot);
    const dx = px - x, dy = py - y, L = Math.hypot(dx, dy) || 1, drift = 12 + 6 * Math.sin(t * 0.9);
    ctx.save();
    ctx.translate(px + (dx / L) * drift * crack, py + (dy / L) * drift * crack);
    ctx.rotate(0.25 * Math.sin(t * 0.6) + 0.3);
    K.seed(431);
    const piece = K.arc(0, 0, 34, 12, -0.9, 0.3, 0.2);
    K.ink(ctx, piece, C.mind, 1.7, 0.4, false, 0.85 * crack);
    ctx.restore();
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const u = k / 5, sx = px + Math.cos(u * 6 + t * 0.4) * (26 + k * 7), sy = py + Math.sin(u * 5 + t * 0.5) * (18 + k * 5);
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + 5, sy - 2);
    }
    K.stroke(ctx, C.cyan, 1, 0.55 * crack);
  }

  // ---------------------------------------------------------------- embers shed by a grieving soul
  function embers(ctx, t, th, from, n) {
    for (let k = 0; k < n; k++) {
      const b = from + k * 0.23;
      if (t < b) break;
      const age = t - b;
      if (age > 3.4) continue;
      const [sx, sy] = soulAt(th(b));
      const a = K.hash(k * 17 + 3) * TAU, v = 16 + K.hash(k * 31 + 5) * 26;
      const x = sx + Math.cos(a) * v * age, y = sy + Math.sin(a) * v * age * 0.6 + 11 * age * age;
      const al = (1 - age / 3.4) * 0.9;
      K.glow(ctx, x, y, 9, C.soul, 0.5 * al);
      ctx.globalAlpha = al;
      ctx.fillStyle = K.mix(C.soulHot, C.ash, age / 3.4);
      ctx.fillRect(x - 1.2, y - 1.2, 2.4, 2.4);
      ctx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------- the whole plate
  /** o: { th, thOf, soulI, soulR, tighten, reveal, others, crack, zoom, focus, embersFrom, t } */
  function orrery(ctx, t, o) {
    K.voidBg(ctx);
    const z = o.zoom ?? 1, f = o.focus || [CX, CY];
    // far stars move less than the plate: a little parallax
    ctx.save();
    const zf = 1 + (z - 1) * 0.25;
    ctx.translate(f[0], f[1]); ctx.scale(zf, zf); ctx.translate(-f[0], -f[1]);
    ctx.save();
    ctx.globalAlpha = 0.95 * o.others;
    ctx.translate(500, 470); ctx.rotate(-0.35 + t * 0.004); ctx.translate(-700, -700);
    ctx.drawImage(nebula, 0, 0, 1400, 1400);
    ctx.restore();
    K.drawStars(ctx, far, t, { alpha: 0.7 * o.others });
    ctx.restore();
    K.fade(o.others, () => K.ruledSky(ctx, { gap: 5, alpha: 0.075, density: (x, y) => 0.25 + 0.75 * Math.pow(1 - y / 1000, 1.5) }));

    ctx.save();
    ctx.translate(f[0], f[1]); ctx.scale(z, z); ctx.translate(-f[0], -f[1]);
    K.drawStars(ctx, stars, t, { alpha: o.others });
    construction(ctx, o.reveal, o.others);
    orbits(ctx, o.reveal, o.others);

    const s = soulAt(o.th), m = mindAt(o.th);
    const lx = s[0] - m[0], ly = s[1] - m[1], ll = Math.hypot(lx, ly) || 1;
    tension(ctx, m, s, o.others * K.sr(o.reveal, 0.5, 1), t);
    brass(ctx, t, m, s, o.others * K.sr(o.reveal, 0.2, 0.7));
    const rs = rings(t, o.tighten);
    const mr = MIND_R * (1 + 0.06 * m[2]);
    const drawMind = () => {
      if (o.others <= 0.01) return;
      K.fade(o.others, () => {
        for (const r of rs) ringHalf(ctx, m[0], m[1], r, false, 0.85, o.crack);
        mindBody(ctx, m[0], m[1], mr, t, lx / ll, ly / ll, o.soulI, o.crack);
        for (const r of rs) ringHalf(ctx, m[0], m[1], r, true, 0.95, o.crack);
        brokenPiece(ctx, m[0], m[1], rs[1], t, o.crack);
      });
    };
    const drawSoul = () => {
      const r = (o.soulR ?? SOUL_R) * (1 + 0.08 * s[2]);
      if (r < 9) K.glow(ctx, s[0], s[1], 46, C.soulHot, 0.55 * o.soulI);
      K.soulStar(ctx, s[0], s[1], r, o.soulI, t);
    };
    if (s[2] > m[2]) { drawMind(); drawSoul(); } else { drawSoul(); drawMind(); }
    if (o.embersFrom != null) embers(ctx, t, o.thOf, o.embersFrom, 16);
    ctx.restore();
    return { soul: s, mind: m };
  }
  FILM.orrery = orrery;

  // ---------------------------------------------------------------- Plate I
  FILM.scenes.orrery = {
    tone: 'void',
    lines: [
      { text: 'To my mind that forbids,', at: 1.7 },
      { text: 'to the soul that I grieve.', at: 5.0 },
    ],
    sfx: [{ at: 0.2, kind: 'chime' }, { at: 9.8, kind: 'whoosh' }],
    mood: (t) => ({ drone: 0.55 + 0.25 * K.sr(t, 5, 9), warm: 0.1 + 0.3 * (1 - K.sr(t, 5, 9.5)), wind: 0.05 }),
    init() {
      stars = K.makeStars(7, 430);
      far = K.makeStars(8, 520);
      nebula = buildDust();
    },
    draw(ctx, t, dur) {
      const th = (x) => -Math.PI / 2 + x * SPIN;
      const soulI = K.lerp(K.lerp(0.9, 1, K.sr(t, 0, 1.4)), 0.42, K.sr(t, 5.4, 9.4));
      const s = soulAt(th(t));
      const dive = K.easeIn(K.range(t, 9.5, dur + 1));
      orrery(ctx, t, {
        th: th(t), thOf: th, soulI,
        soulR: K.lerp(3, SOUL_R, K.sr(t, 0.1, 1.8)),
        tighten: 1 - 0.14 * K.sr(t, 1.8, 4.8) - 0.06 * K.sr(t, 5.2, 10),
        reveal: K.sr(t, 1.0, 4.6),
        others: K.sr(t, 0.6, 2.8),
        crack: 0,
        zoom: (1 + 0.05 * K.sr(t, 0, dur)) * (1 + 11 * dive),
        focus: [K.lerp(CX, s[0], K.sr(t, 9.2, 10.6)), K.lerp(CY, s[1], K.sr(t, 9.2, 10.6))],
        embersFrom: 5.5,
      });
    },
  };

  // ---------------------------------------------------------------- Plate IX
  let wstars;
  function water(ctx, t, a) {
    if (a <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = a;
    K.voidBg(ctx);
    // reflected sky: stars squeezed and shivering on the surface
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, 1000, 1000); ctx.clip();
    for (const s of wstars) {
      const y = 380 + (s.y - 380) * 0.8, wob = Math.sin(y * 0.045 + t * 2.2) * 3 * (1 - K.sr(t, 0, 3));
      const al = a * (0.25 + 0.75 * s.m) * (0.6 + 0.4 * Math.sin(t * 1.6 + s.ph));
      ctx.globalAlpha = al;
      ctx.fillStyle = C.voidInk;
      const w = 0.8 + s.m * 2.2;
      ctx.fillRect(s.x + wob - w / 2, y - w * 1.6, w, w * 3.2);
    }
    ctx.restore();
    ctx.globalAlpha = a;
    // the soul, reflected
    K.glow(ctx, 500, 540, 120, C.soul, 0.4 * a);
    ctx.save();
    ctx.translate(500, 540); ctx.scale(1, 2.4);
    K.glow(ctx, 0, 0, 22, C.soulHot, 0.8 * a);
    ctx.restore();
    // rings on the water, settling
    const settle = 1 - K.sr(t, 0.4, 3.2);
    for (let k = 0; k < 6; k++) {
      const age = K.frac(t * 0.32 + k / 6), r = 30 + age * 560;
      const al = (1 - age) * 0.55 * settle * a;
      if (al < 0.01) continue;
      K.seed(701 + k);
      K.ink(ctx, K.arc(500, 540, r, r * 0.3, 0, TAU * 1.01), k % 2 ? C.cyan : C.voidInk, 1.2, 1.4, false, al);
    }
    // surface strokes
    ctx.beginPath();
    for (let k = 0; k < 16; k++) {
      const y = 600 + k * 24 + (t * 6) % 24, x0 = 120 + K.hash(k * 13) * 380, L = 80 + K.hash(k * 7) * 260;
      K.trace(ctx, K.seg(x0, y, x0 + L, y, 14), 1.2);
    }
    K.stroke(ctx, C.voidInk, 0.8, 0.12 * a);
    ctx.restore();
  }

  // The Earth, engraved once into a texture: land, sea, cloud, with ruled line-work.
  let earthTex = null, earthLights = [];
  const mixA = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  function buildEarth() {
    const S = 512, c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d'), id = x.createImageData(S, S), d = id.data, g = K.stable(12);
    const ocean = [24, 56, 92], deep = [10, 26, 50], land = [206, 172, 104], landDark = [128, 98, 52], cloud = [238, 230, 212];
    earthLights = [];
    for (let j = 0; j < S; j++) {
      for (let i = 0; i < S; i++) {
        const u = (i / S) * 2 - 1, v = (j / S) * 2 - 1;
        if (u * u + v * v > 1.02) continue;
        const n = K.fbm(u * 2.3 + 11, v * 2.3 + 4, 4), rule = Math.sin((u * 0.94 + v * 0.34) * 170);
        let col;
        if (n > 0.06) {
          col = mixA(land, landDark, K.clamp((n - 0.06) * 4) * 0.55 + (rule > 0.55 ? 0.32 : 0));
          if (g() < 0.01) earthLights.push([u, v]);
        } else col = mixA(ocean, deep, K.clamp(-n * 3) * 0.7 + (rule > 0.7 ? 0.28 : 0));
        const cl = K.fbm(u * 3.1 + 40, v * 5.4 + 7, 4);
        if (cl > 0.16) col = mixA(col, cloud, K.clamp((cl - 0.16) * 3.2) * 0.85);
        const k = (j * S + i) * 4;
        d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = 255;
      }
    }
    x.putImageData(id, 0, 0);
    earthTex = c;
  }

  function earth(ctx, t, x, y, r, a) {
    if (r < 1 || a <= 0.01) return;
    K.fade(a, () => {
      K.glow(ctx, x, y, r * 1.22, C.cyan, 0.3);
      const spin = t * 0.03, cs = Math.cos(spin), sn = Math.sin(spin);
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.clip();
      ctx.globalAlpha = K.A;
      ctx.translate(x, y);
      ctx.rotate(spin);
      ctx.drawImage(earthTex, -r, -r, 2 * r, 2 * r);
      ctx.restore();
      const body = K.arc(x, y, r, r, 0, TAU, 0, Math.max(4, r / 30));
      const shade = K.sphereTone(x, y, r, -0.55, -0.72, 0.02);
      const gap = K.clamp(r / 95, 2.2, 6);
      K.seed(801);
      K.hatch(ctx, body, { angle: 1.2, gap, step: gap * 2.6, amp: 0.5, color: '#02050C', width: 1.3, density: shade });
      K.hatch(ctx, body, { angle: 2.45, gap: gap * 1.25, step: gap * 2.6, amp: 0.5, color: '#02050C', width: 1.1, density: (px, py) => (shade(px, py) - 0.45) / 0.55 });
      if (r > 30) {
        ctx.save();
        ctx.fillStyle = C.soulHot;
        for (const [u, v] of earthLights) {
          const px = x + (u * cs - v * sn) * r, py = y + (u * sn + v * cs) * r;
          const dk = shade(px, py);
          if (dk < 0.62) continue;
          ctx.globalAlpha = K.A * K.clamp((dk - 0.62) * 4) * 0.9;
          const z = r > 300 ? 2.2 : 1.4;
          ctx.fillRect(px - z / 2, py - z / 2, z, z);
        }
        ctx.restore();
      }
      K.ink(ctx, body, C.cyan, 1.6, 0.8, true, 0.85);
      K.ink(ctx, K.arc(x, y, r * 1.025, r * 1.025, 3.5, 5.6), C.cyan, 3, 0.8, false, 0.4);
    });
  }

  FILM.scenes.return = {
    tone: 'void',
    lines: [
      { text: 'To my mind that forbids,', at: 5.2 },
      { text: 'To the soul that I grieve.', at: 7.6 },
    ],
    sfx: [{ at: 0.4, kind: 'chime' }, { at: 5.1, kind: 'chime' }, { at: 9.5, kind: 'chime' }],
    mood: (t) => ({ drone: 0.5, warm: 0.2 + 0.25 * K.sr(t, 4, 7), rain: 0.5 * (1 - K.sr(t, 0, 2.8)) }),
    init() {
      if (!stars) FILM.scenes.orrery.init();
      wstars = K.makeStars(21, 380, 0, 360, 1000, 1000);
      buildEarth();
    },
    draw(ctx, t, dur) {
      const th = (x) => -Math.PI / 2 + (x - dur) * SPIN;
      const s = soulAt(th(t));
      const rise = K.sr(t, 1.8, 3.4);
      const u = K.easeInOut(K.range(t, 1.6, 5.4));
      const er = 1050 * Math.pow(1 - u, 2.4);
      const ex = K.lerp(500, s[0], u), ey = K.lerp(1560, s[1], Math.pow(u, 0.8));
      const settle = K.sr(t, 10.1, 11.7);
      const others = K.sr(t, 3.6, 6.0) * (1 - settle);
      orrery(ctx, t, {
        th: th(t), thOf: th,
        soulI: K.lerp(0.68, 0.9, settle),
        soulR: K.lerp(K.lerp(0, SOUL_R, K.sr(t, 4.4, 5.8)), 3, K.sr(t, 10.4, 11.9)),
        tighten: 0.86,
        reveal: K.sr(t, 3.8, 6.6),
        others,
        crack: K.sr(t, 4.2, 6.4),
        zoom: K.lerp(1.7, 1, K.easeInOut(K.range(t, 3.4, 6.8))),
        focus: [s[0], s[1]],
      });
      earth(ctx, t, ex, ey, er, K.sr(t, 1.4, 2.6) * (1 - K.sr(t, 4.9, 5.6)));
      water(ctx, t, 1 - rise);
      // signature
      K.write(ctx, '— Sahaib', 928, 970, { size: 34, align: 'right', color: C.voidInk, progress: K.range(t, 9.4, 10.6), alpha: 1 - K.range(t, dur - 0.8, dur - 0.1) });
    },
  };
})();

<script>
// The poem's words in this file are © 2026 Sahaib Singh Arora, all rights reserved — see examples/to-my-mind/NOTICE in the ink-film repository. The code is MIT.
'use strict';
/* Plate II — the eye.
   A galaxy that turns out to be an iris; the dive through the pupil; and the world beyond it
   seen in fractured, tear-blurred cells — a figure at a bright horizon (the vision) whose
   shadow grows long and looms (the fear). Nothing is ever fully clear. */
(function () {
  const FILM = window.FILM, K = FILM.K, C = K.C, TAU = K.TAU;
  const SX = 500, SY = 450;   // where the eye's centre sits on screen
  const RI = 132;             // iris radius, world units at scale 1
  const AX = 500, AY = 450, AR = 450; // the mosaic aperture (seen from inside the pupil)
  let gal = null, stars = null, veins = null, lashesUp = null, lashesLo = null, ALMOND = null;

  // ---------------------------------------------------------------- the lids (world units, eye centre at 0,0)
  const up = (x) => { const u = x / 300; return 6 - 8 * u - 141 * Math.pow(Math.max(0, 1 - u * u), 0.8); };
  const lo = (x) => { const u = x / 300; return 6 - 8 * u + 128 * Math.pow(Math.max(0, 1 - u * u), 0.85); };

  // ---------------------------------------------------------------- timing
  function camScale(t) {
    const pull = K.easeInOut(K.range(t, 2.2, 4.4));
    let s = K.lerp(K.lerp(5.8, 5.0, K.range(t, 0, 2.2)), 1.0, pull);
    s *= 1 + 0.07 * K.sr(t, 4.2, 4.85);            // lean in
    s *= 1 + 13 * K.easeIn(K.range(t, 4.85, 5.65)); // dive through the pupil
    return s;
  }
  function pupilAt(t) {
    const dark = K.sr(t, 1.5, 2.6);                 // the galaxy's bright core goes dark: a pupil
    const r = K.lerp(22, 38, dark) + 3 * Math.sin(t * 1.3) * (1 - K.sr(t, 4.2, 4.6))
      + 32 * K.sr(t, 4.3, 5.0) + 30 * K.sr(t, 5.0, 5.6);
    return { dark, r };
  }
  // vision → fear → almost vision → fear
  function fearAt(t) {
    const osc = t < 5.7 ? 0 : 0.5 - 0.5 * Math.cos(((t - 5.7) * Math.PI) / 1.25);
    return K.clamp(Math.max(t > 8.2 ? 0 : osc, K.sr(t, 7.5, 8.3)));
  }
  function apertureAt(t) {
    return AR * K.easeOut(K.range(t, 5.3, 5.95)) * (1 - K.easeIn(K.range(t, 8.2, 9.0)));
  }

  // ---------------------------------------------------------------- one-time layout
  const GCOL = [C.soulHot, C.soul, C.goldLight, C.cyan, C.mind, '#FFFFFF'];
  function buildGalaxy() {
    const g = K.stable(41), pts = [];
    const gauss = () => (g() + g() + g() - 1.5) / 1.5;
    const mk = (r, th, bulge) => {
      const f = r / RI, q = g();
      let col;
      if (bulge || f < 0.28) col = q < 0.5 ? 0 : 1;
      else if (f < 0.55) col = q < 0.45 ? 1 : q < 0.8 ? 2 : 3;
      else col = q < 0.12 ? 2 : q < 0.6 ? 3 : q < 0.9 ? 4 : 5;
      pts.push({ r, th, col, sz: 0.7 + g() * g() * 2.4, a: 0.35 + g() * 0.65, w: 0.11 * Math.pow(40 / Math.max(r, 12), 0.5) });
    };
    const arms = [0, Math.PI, Math.PI * 0.5, Math.PI * 1.5];
    for (let i = 0; i < 3000; i++) {
      const k = i % 4, major = k < 2;
      if (!major && g() < 0.45) continue;
      const r = 14 + (RI - 14) * Math.pow(g(), 0.9);
      mk(r + gauss() * 5, arms[k] + Math.log(r / 16) * 2.1 + gauss() * (major ? 0.2 : 0.32));
    }
    for (let i = 0; i < 800; i++) mk(2 + Math.abs(gauss()) * 34, g() * TAU, true);
    for (let i = 0; i < 1400; i++) mk(14 + Math.sqrt(g()) * (RI - 10), g() * TAU);
    return pts;
  }
  function buildVeins() {
    const g = K.stable(77), out = [];
    const walk = (x, y, dir, n, w) => {
      const pts = [[x, y]];
      for (let k = 0; k < n; k++) {
        dir += (g() - 0.5) * 0.7;
        const toC = Math.atan2(-y, -x);
        dir += Math.sin(toC - dir) * 0.18;
        x += Math.cos(dir) * 9; y += Math.sin(dir) * 9;
        if (Math.hypot(x, y) < RI + 6) break;
        pts.push([x, y]);
        if (k === 3 || k === 7) out.push({ pts: walk(x, y, dir + (g() > 0.5 ? 0.7 : -0.7), Math.floor(n * 0.45), w * 0.6).pts, w: w * 0.6 });
      }
      return { pts, w };
    };
    for (let i = 0; i < 10; i++) {
      const side = i % 2 ? 1 : -1, x = side * (215 + g() * 80), y = K.lerp(up(x) + 8, lo(x) - 8, g());
      out.push(walk(x, y, side > 0 ? Math.PI + (g() - 0.5) : (g() - 0.5), 14 + Math.floor(g() * 8), 1));
    }
    return out;
  }
  function buildLashes() {
    const g = K.stable(88), U = [], L = [];
    for (let i = 0; i <= 62; i++) {
      const x = -284 + (i * 570) / 62, y = up(x), dy = (up(x + 1) - up(x - 1)) / 2, ln = Math.hypot(1, dy);
      const tx = 1 / ln, ty = dy / ln, nx = dy / ln, ny = -1 / ln;
      const len = (16 + 34 * Math.pow(Math.sin((Math.PI * (x + 300)) / 600), 0.7)) * (0.6 + 0.7 * g());
      const lean = (x / 300) * 0.45 + 0.15;
      U.push({ x, y, nx, ny, tx, ty, len, lean, ph: g() * TAU });
    }
    for (let i = 0; i <= 38; i++) {
      const x = -250 + (i * 530) / 38, y = lo(x), dy = (lo(x + 1) - lo(x - 1)) / 2, ln = Math.hypot(1, dy);
      const tx = 1 / ln, ty = dy / ln, nx = -dy / ln, ny = 1 / ln;
      L.push({ x, y, nx, ny, tx, ty, len: (7 + 10 * Math.sin((Math.PI * (x + 300)) / 600)) * (0.7 + 0.6 * g()), lean: (x / 300) * 0.3, ph: g() * TAU });
    }
    return [U, L];
  }

  // ---------------------------------------------------------------- the galaxy / iris (screen space, constant dot size)
  function spiral(k, t, s, off, r0, r1) {
    const pts = [];
    for (let r = r0; r <= r1; r += 2.5) {
      const th = k + Math.log(r / 16) * 2.1 + off + t * 0.11 * Math.pow(40 / r, 0.5);
      pts.push([SX + Math.cos(th) * r * s, SY + Math.sin(th) * r * s]);
    }
    return pts;
  }
  function galaxy(ctx, t, s, pup) {
    // nebulous light along the two great arms
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const k of [0, Math.PI]) {
      const pts = spiral(k, t, s, 0, 16, RI);
      for (const [w, a, col] of [[22, 0.05, C.soul], [9, 0.07, C.cyan]]) {
        ctx.beginPath();
        K.path(ctx, pts, false);
        ctx.lineWidth = w * Math.min(s, 3);
        ctx.strokeStyle = col;
        ctx.globalAlpha = a * K.A;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
    ctx.restore();
    K.glow(ctx, SX, SY, 70 * s, C.soul, 0.75 * (1 - 0.85 * pup.dark));
    K.glow(ctx, SX, SY, 26 * s, C.soulHot, 0.9 * (1 - 0.9 * pup.dark));
    // dust lanes, hand-inked
    K.seed(621);
    for (const k of [0, Math.PI]) {
      K.ink(ctx, spiral(k, t, s, -0.32, 22, RI * 0.95), '#05050C', K.clamp(2.6 * s, 1.5, 12), 1.2, false, 0.55);
      K.ink(ctx, spiral(k, t, s, -0.52, 30, RI * 0.8), '#05050C', K.clamp(1.2 * s, 0.8, 5), 1, false, 0.35);
    }
    // the stars of the galaxy, which are also the flecks of an iris
    const dotK = K.clamp(0.55 + s * 0.2, 0.75, 1.8);
    const buckets = GCOL.map(() => []);
    for (const p of gal) {
      const th = p.th + t * p.w, x = SX + Math.cos(th) * p.r * s, y = SY + Math.sin(th) * p.r * s;
      if (x < -4 || x > 1004 || y < -4 || y > 1004) continue;
      buckets[p.col].push(x, y, p.sz * dotK, p.a);
    }
    ctx.save();
    for (let c = 0; c < GCOL.length; c++) {
      ctx.fillStyle = GCOL[c];
      const b = buckets[c];
      for (let i = 0; i < b.length; i += 4) {
        ctx.globalAlpha = b[i + 3] * K.A;
        const z = b[i + 2];
        ctx.fillRect(b[i] - z / 2, b[i + 1] - z / 2, z, z);
      }
    }
    ctx.restore();
  }
  /** Radial fibres, collarette and limbus: what makes the galaxy read as an iris. */
  function irisMarks(ctx, t, s, rp, v) {
    if (v <= 0.01) return;
    K.fade(v, () => {
      const g = K.stable(55);
      K.seed(631);
      const paths = [[], []];
      for (let i = 0; i < 170; i++) {
        const a0 = g() * TAU, tw = (g() - 0.5) * 0.4, c = i % 2, len = 0.55 + g() * 0.45, pts = [];
        for (let k = 0; k <= 8; k++) {
          const u = k / 8, r = rp + (RI - rp) * u * len, a = a0 + tw * u + 0.05 * Math.sin(u * 6 + i) + t * 0.02;
          pts.push([SX + Math.cos(a) * r * s, SY + Math.sin(a) * r * s]);
        }
        paths[c].push(pts);
      }
      for (const [c, col, al] of [[0, C.soul, 0.45], [1, C.cyan, 0.4]]) {
        ctx.beginPath();
        for (const p of paths[c]) K.trace(ctx, p, 0.5);
        K.stroke(ctx, col, 0.9, al);
      }
      // collarette: the wavy ring around the pupil
      const rc = rp + (RI - rp) * 0.33, cpts = [];
      for (let k = 0; k <= 96; k++) {
        const a = (k / 96) * TAU + t * 0.02, r = rc + 4 * Math.sin(a * 17) + 2 * Math.sin(a * 5 + 1);
        cpts.push([SX + Math.cos(a) * r * s, SY + Math.sin(a) * r * s]);
      }
      K.ink(ctx, cpts, C.goldLight, 1.4, 0.6, true, 0.55);
      // limbus
      K.ink(ctx, K.arc(SX, SY, RI * s, RI * s, 0, TAU * 1.02), '#070B16', K.clamp(7 * s, 4, 16), 0.8, false, 0.9);
      K.ink(ctx, K.arc(SX, SY, RI * s + 5, RI * s + 5, 0, TAU * 1.02), C.cyan, 0.9, 0.8, false, 0.4);
    });
  }
  function pupilDisc(ctx, t, s, pup) {
    if (pup.dark <= 0.01) return;
    const r = pup.r * s;
    ctx.save();
    ctx.beginPath();
    ctx.arc(SX, SY, r, 0, TAU);
    ctx.fillStyle = '#030306';
    ctx.globalAlpha = pup.dark * K.A;
    ctx.fill();
    ctx.restore();
    // the pupillary ruff, a ragged amber rim
    K.seed(641);
    const pts = [];
    for (let k = 0; k <= 80; k++) { const a = (k / 80) * TAU; pts.push([SX + Math.cos(a) * (r + 1.5 * Math.sin(a * 23 + t)), SY + Math.sin(a) * (r + 1.5 * Math.sin(a * 23 + t))]); }
    K.ink(ctx, pts, C.soul, K.clamp(1.2 * s, 1, 6), 0.4, true, 0.6 * pup.dark);
  }

  // ---------------------------------------------------------------- the face around it (world space)
  function skin(ctx, t, s) {
    const lw = 1 / Math.sqrt(s);
    // pale lines are light: lit from the upper left, falling away into the dark
    const lit = (x, y) => {
      const q = (x / 470) ** 2 + ((y + 50) / 370) ** 2;
      let b = K.clamp(1.18 - q) * K.clamp(0.72 - x / 1300 - y / 1500);
      const lid = up(x);
      if (y < lid - 14 && y > lid - 70) b *= 0.35;               // the crease sits in shadow
      else if (y < lid - 70 && y > lid - 150) b *= 0.7;          // the socket
      if (y > lo(x) + 6 && y < lo(x) + 40) b *= 0.55;            // under the lower lid
      return b;
    };
    K.seed(611);
    ctx.beginPath();
    const family = (n, fn) => {
      for (let k = 1; k <= n; k++) {
        const tau = K.r() * 0.9 + 0.04, wob = K.r() * 50;
        let pen = false;
        for (let x = -300; x <= 300; x += 9) {
          const [X, Y] = fn(x, k);
          const yy = Y + 0.9 * K.n1(wob + x * 0.03);
          if (lit(X, yy) > tau) { pen ? ctx.lineTo(X, yy) : ctx.moveTo(X, yy); pen = true; } else pen = false;
        }
      }
    };
    family(40, (x, k) => [x * (1 + k * 0.028), up(x) * (1 + k * 0.012) - k * 6.4]);
    family(26, (x, k) => [x * (1 + k * 0.026), lo(x) * (1 + k * 0.01) + k * 6.6]);
    K.stroke(ctx, C.voidInk, 0.95 * lw, 0.5);
    // cross-contours on the lit brow ridge and cheek
    K.hatch(ctx, null, { bbox: { x0: -460, y0: -420, x1: 460, y1: 330 }, angle: 1.3, gap: 7, step: 14, amp: 0.8, color: C.voidInk, width: 0.7 * lw, alpha: 0.2,
      density: (x, y) => (y > up(x) - 12 && y < lo(x) + 8 && Math.abs(x) < 300 ? 0 : (lit(x, y) - 0.56) / 0.44) });
    // crease, under-eye fold, and the brow
    K.seed(612);
    const crease = [];
    for (let x = -268; x <= 286; x += 12) crease.push([x, up(x) - 42 * Math.pow(Math.max(0, 1 - (x / 290) ** 2), 0.6) - 4]);
    K.ink(ctx, crease, C.voidInk, 1.4 * lw, 1, false, 0.55);
    const fold = [];

  /** Drafting marks around the iris: the eye as an optical diagram. */

      K.seed(681);

      K.stroke(ctx, C.cyan, 0.8 * lw, 0.22);

  /** Light gathering into the pupil as we fall in. */
  function rays(ctx, t, a) {
    if (a <= 0.01) return;
    K.seed(691);

    for (let k = 0; k < 22; k++) {
      const an = (k / 22) * TAU + 0.13, R = 760, f = K.frac(t * 0.9 + k * 0.37);
      const x0 = SX + Math.cos(an) * R, y0 = SY + Math.sin(an) * R;
      const x1 = SX + Math.cos(an) * R * (0.25 + 0.2 * f), y1 = SY + Math.sin(an) * R * (0.25 + 0.2 * f);

  // ---------------------------------------------------------------- the world through the pupil
  const SHADOW = [16, 9, 16], FIG = [30, 20, 14], AMBER = K.rgb(C.soul), HOT = K.rgb(C.soulHot);
  const mix3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  function palette(f) {
    const m = (a, b) => mix3(K.rgb(a), K.rgb(b), f);
    return {
      top: m('#3E5C8A', '#150C26'), hor: m('#F7D08A', '#C4533C'),
      sun: m('#FFE6A8', '#E0603E'), halo: m('#F3A53A', '#B8412C'),
      gNear: m('#A87C45', '#6B2C30'), gFar: m('#E3C27E', '#9A4A44'),
      sunY: K.lerp(300, 640, f), sunR: K.lerp(112, 70, f), rays: 1 - f, shadowL: K.lerp(30, 250, f),
    };
  }
  const FS = 1.55, FEET = 662, CHEST = FEET - (FEET - 470) * FS;
  function inFigure(x0, y0) {
    const x = 500 + (x0 - 500) / FS, y = FEET + (y0 - FEET) / FS;
    const dx = x - 500, ax = Math.abs(dx);
    if (Math.hypot(dx, y - 413) < 25) return true;                                      // head
    if (y >= 434 && y < 452 && ax < 10) return true;                                     // neck
    if (y >= 450 && y < 562 && ax < K.lerp(35, 22, (y - 450) / 112)) return true;       // coat
    if (y >= 456 && y < 568) { const o = K.lerp(36, 41, (y - 456) / 112); if (ax > o - 9 && ax < o) return true; } // arms
    if (y >= 560 && y < 662 && Math.abs(ax - K.lerp(11, 15, (y - 560) / 102)) < 8.5) return true; // legs

  function sceneColor(x, y, t, P) {
    const HY = 600;
    let c;
    if (y < HY) { const u = K.clamp(y / HY); c = mix3(P.top, P.hor, u * u); }
    else {
      const u = K.clamp((y - HY) / 400);

      if (K.frac((Math.atan2(y - HY, x - 500) * 9) / Math.PI) < 0.5) c = mix3(c, [0, 0, 0], 0.12);

    const blur = 0.55 + 0.35 * Math.sin(t * 2.1 + 4.47) + 0.45 * fear;
    const hw = Math.sqrt(3) * rho, vh = 1.5 * rho;

      ctx.beginPath();

    seg(lt, C.voidInk, 0.26, 1);

    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 0.2 * K.A;
    ctx.stroke(lens);
    ctx.globalAlpha = 1;

    ctx.beginPath();
    for (let i = 0; i < glints.length; i += 3) { ctx.moveTo(glints[i] + glints[i + 2], glints[i + 1]); ctx.arc(glints[i], glints[i + 1], glints[i + 2], 0, TAU); }

    ctx.globalAlpha = 0.55 * K.A;
    ctx.fill();

    K.seed(702);
    if (ty > AY - R * 0.7 && ty < AY + R * 0.7) K.ink(ctx, K.arc(AX - R * 0.2, ty, R * 0.9, R * 0.9, -2.2, -0.95), '#FFFFFF', 2, 1.2, false, 0.18 * K.clamp(R / AR));

    ctx.beginPath();
    ctx.arc(AX, AY, R + rho * 0.75, 0, TAU);
    ctx.lineWidth = rho * 1.5;
    ctx.strokeStyle = '#030306';
    ctx.globalAlpha = K.A;

    ctx.globalAlpha = 1;

  }

      const g = K.stable(711);

  // ---------------------------------------------------------------- plate
  FILM.scenes.eye = {
    tone: 'void',
    lines: [
      { text: 'Nothing is clear,', at: 1.0 },
      { text: 'The vision, the fear.', at: 3.8 },
    ],
    sfx: [
      { at: 0.3, kind: 'chime' },
      { at: 4.85, kind: 'whoosh' },
      { at: 5.6, kind: 'hiss' },
      { at: 8.25, kind: 'whoosh' },
    ],
    mood: (t) => {
      const f = fearAt(t);
      return { drone: 0.75, warm: 0.35 * (1 - K.sr(t, 2, 4)) + 0.4 * (1 - f) * K.sr(t, 5.5, 6), wind: 0.45 * f, rumble: 0.2 * f };
    },
    init() {
      gal = buildGalaxy();
      stars = K.makeStars(33, 460);
      veins = buildVeins();
      [lashesUp, lashesLo] = buildLashes();
      ALMOND = [];
      for (let x = -300; x <= 300; x += 10) ALMOND.push([x, up(x)]);
      for (let x = 300; x >= -300; x -= 10) ALMOND.push([x, lo(x)]);
    },
    draw(ctx, t, dur) {
      if (t >= 9.0) { ctx.fillStyle = '#030306'; ctx.fillRect(0, 0, 1000, 1000); return; }

        // One camera, one eye. At the start we are so close that the iris fills the frame and
        // reads as a galaxy; pulling back brings the white, the lids and the face in from the
        // edges. Nothing cross-fades, so no frame is a half-transparent veil.
        const s = camScale(t), pup = pupilAt(t);
        K.voidBg(ctx);
        K.drawStars(ctx, stars, t, { alpha: 0.8 });
        K.ruledSky(ctx, { gap: 6, alpha: 0.06, seed: 62 });

        ctx.save();

        ctx.scale(s, s);

        sclera(ctx, t, s, 1);
        ctx.restore();

        ctx.save();
        ctx.translate(SX, SY);
        ctx.scale(s, s);
        K.clipTo(ctx, ALMOND);
        ctx.setTransform(base);
        ctx.beginPath();
        ctx.arc(SX, SY, RI * s, 0, TAU);
        ctx.clip();
        const ig = ctx.createRadialGradient(SX, SY, 0, SX, SY, RI * s);
        ig.addColorStop(0, '#2A1A14');
        ig.addColorStop(0.45, '#141B2C');
        ig.addColorStop(1, '#0A1222');
        ctx.fillStyle = ig;
        ctx.fillRect(0, 0, 1000, 1000);
        galaxy(ctx, t, s, pup);
        irisMarks(ctx, t, s, pup.r, 1 - K.sr(s, 1.8, 4.2));
        pupilDisc(ctx, t, s, pup);
        ctx.restore();
        ctx.save();
        ctx.translate(SX, SY);
        ctx.scale(s, s);
        catchlight(ctx, s, t);
        if (s < 4.6) lids(ctx, t, s, 1);
        construction(ctx, t, s, K.sr(t, 3.1, 4.2) * (1 - K.sr(t, 4.75, 5.1)));
        ctx.restore();
        rays(ctx, t, K.sr(t, 4.4, 4.95) * (1 - K.sr(t, 5.25, 5.6)));
      } else {
        ctx.fillStyle = '#030306';
        ctx.fillRect(0, 0, 1000, 1000);
      }
      const R = apertureAt(t);
      mosaic(ctx, t, R);
      apertureRim(ctx, t, R);
    },
  };
})();

'use strict';
/* Plates III and IV — the memory and the loss.
   III: a child in a locket, praying by an oil lamp; one unbroken thread of light runs to a star.

  function limb(center, widths, per = 5) {

    K.hatch(ctx, HANDS_PTS, { angle: -1.0, gap: 2.6, step: 5, amp: 0.3, color: '#3A1E0E', width: 0.7, density: (x) => K.clamp((446 - x) / 26 + 0.6 * dark) });

  /** The heart: an amber point at the chest, beating. */
  function heart(ctx, g, i) {

    const b = beat(g);
    K.glow(ctx, CHEST[0], CHEST[1], 30 + 26 * b, C.soul, (0.3 + 0.35 * b) * i, 'source-over');

  // ---------------------------------------------------------------- the room
  const WIN_PTS = K.arc(WIN.cx, WIN.top, WIN.r, WIN.r, Math.PI, TAU, 0, 6).concat([[WIN.x1, WIN.y1], [WIN.x0, WIN.y1]]);

  function roomBack(ctx, g, fl, flick) {

    K.hatch(ctx, wallR, { angle: 1.2, gap: 3.3, step: 15, amp: 0.8, color: SHADE, width: 0.85, density: dens });

  /** The one bright star the thread is tied to. */

    const hull = K.spline(CHILD_HULL.filter((_, i) => i % 3 === 0).map(proj), true, 2);
    const wall = [[100, 90], [900, 90], [900, FLOOR_Y], [100, FLOOR_Y]];

    K.clipTo(ctx, wall);
    K.seed(2301);
    K.fill(ctx, hull, SHADE, 0.35 * fl, 2);
    K.crosshatch(ctx, hull, { angle: 0.8, gap: 3.4, step: 10, amp: 0.8, color: SHADE, width: 1, alpha: 0.75 * fl, density: () => 0.8 });
