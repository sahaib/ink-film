<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* One visual world, deliberately: the page takes the preset's own ground and inks in both themes
     (the engine sets these tokens from the preset; the values here are the engraved-cosmos defaults).
     --ar / --wh are the film's aspect: W / H of its drawing space. */
  :root {
    color-scheme: dark;
    --ground: #07070F;
    --ink: #E8DDC2;
    --muted: #8C8474;
    --rule: #2A2733;
    --accent: #F3A53A;
    --font: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-display: "IM Fell English SC", "IM Fell English", Georgia, serif;
    --font-ui: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ar: 1 / 1;
    --wh: 1;
    /* as wide as fits: the column, the height left under the controls, and 920px across the short side */
    --screen: min(100%, calc((100dvh - 150px) * var(--wh)), calc(920px * max(1, var(--wh))));
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font);
  }
  .film {
    box-sizing: border-box;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-inline: 16px;
    padding-block: 18px;
  }
  .screen {
    width: var(--screen);
    max-width: 100%;
    aspect-ratio: var(--ar);
  }
  #film {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--ground);
    box-shadow: 0 0 0 1px var(--rule), 0 40px 90px -40px rgba(0, 0, 0, 0.9);
    cursor: pointer;
  }
  .deck {
    width: var(--screen);
    max-width: 100%;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 14px;
  }
  .deck button {
    appearance: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .deck button[hidden] { display: none; }
  .deck button:hover { border-color: var(--muted); }
  .deck button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .deck svg { width: 16px; height: 16px; fill: currentColor; }
  .deck svg [hidden] { display: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .track { position: relative; height: 32px; cursor: pointer; touch-action: none; }
  .track .rail, .track .done { position: absolute; top: 50%; height: 1px; left: 0; }
  .track .rail { right: 0; background: var(--rule); }
  .track .done { background: var(--ink); opacity: 0.7; }
  .track .tick { position: absolute; top: calc(50% - 5px); width: 1px; height: 10px; background: var(--muted); opacity: 0.8; }
  .track .head {
    position: absolute;
    top: 50%;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .clock {
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .colophon {
    margin: 0;
    font-family: var(--font-display);
    font-size: 15px;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-align: center;
    text-wrap: balance;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @media (max-width: 480px) {
    .deck { gap: 10px; }
    .clock { font-size: 11px; }
  }
</style>

<main class="film">
  <div class="screen">
    <canvas id="film" role="img" aria-label="An animated, hand-drawn film: {{title}}."></canvas>
  </div>
  <div class="deck">
    <button id="play" type="button" aria-label="Pause">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-pause" d="M4 2h3v12H4zM9 2h3v12H9z"/><path class="i-play" d="M4 2l10 6-10 6z" hidden/></svg>
    </button>
    <div id="track" class="track" role="slider" tabindex="0" aria-label="Position in the film" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="rail"></div>
      <div class="done"></div>
      <div class="head"></div>
    </div>
    <span id="clock" class="clock">0:00 / 0:00</span>
    <button id="sound" type="button" aria-label="Sound" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path class="i-wave" d="M11 5.2c1 .8 1.5 1.7 1.5 2.8s-.5 2-1.5 2.8l-.8-.9c.7-.5 1-1.2 1-1.9s-.3-1.4-1-1.9z" hidden/><path class="i-mute" d="M10.6 5.4l.9-.9 1.6 1.6 1.6-1.6.9.9L14 7l1.6 1.6-.9.9L13.1 7.9l-1.6 1.6-.9-.9L12.2 7z"/></svg>
    </button>
  </div>
  <p class="colophon">{{colophon}}</p>
  <p id="now-line" class="sr-only" aria-live="polite"></p>
</main>
